<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="tc-logo.png">
<title>TC Pré Moldados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: barra de ferramentas fixa no topo com abas; conteúdo em largura controlada; formulários abrem em painel lateral. */
:root{
  /* Marca TC: amarelo #FFC400, preto #0B0B0B, cinza industrial #666666 */
  --bg:#F1F1F0; --surface:#FFFFFF; --surface-2:#F5F5F4; --line:#D9D9D7; --ink:#0B0B0B; --muted:#666666;
  --accent:#FFC400; --accent-ink:#0B0B0B; --accent-soft:#FFF4CC; --link:#8A6300; color-scheme:light; --steel:#333333;
  --top-bg:#FFFFFF; --top-ink:#0B0B0B; --top-muted:#666666; --top-line:#D9D9D7;
  --ok:#1C7A4A; --warn:#A86300; --bad:#B3261E; --info:#1F5FAD; --shadow:0 10px 30px rgba(0,0,0,.18);
  --f-display:"Montserrat","Arial Black",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
/* Tema claro único, a pedido da TC: cinza claro com amarelo da marca. */
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;margin:0;text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--top-bg)}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--top-bg);color:var(--top-ink);border-bottom:3px solid var(--accent)}
.top .btn.ghost{color:var(--top-ink);border-color:var(--top-line)}
.top .btn.ghost:hover{border-color:var(--accent)}
.logo{width:46px;height:46px;flex:none;display:block}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.stamp{font-family:var(--f-display);font-weight:700;font-size:20px;background:var(--accent);color:var(--accent-ink);padding:2px 8px;border-radius:3px;letter-spacing:.04em}
.brand h1{font-size:17px;text-transform:uppercase;letter-spacing:.08em;color:var(--top-ink)}
.brand small{display:block;color:var(--top-muted);font-size:12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-3px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--top-muted);text-decoration:none;padding:8px 12px 9px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--top-ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a .cnt{font-family:var(--f-mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 6px;margin-left:4px;vertical-align:2px}

main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.head p{margin:2px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* botões e campos */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--link);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
label.f>span{text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.search{max-width:260px}

/* painéis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{font-size:13.5px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;color:var(--steel)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:860px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi{border-top:3px solid var(--accent)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.pos .v{color:var(--ok)} .kpi.neg .v{color:var(--bad)}
.cols2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cols2{grid-template-columns:minmax(0,1fr)}}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center}
.bar-row .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:2px}
.bar-fill.cost{background:var(--warn)}
.bar-row .v{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* tabelas */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.money{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sub{color:var(--muted);font-size:12px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;border:1px solid currentColor}
.st-rascunho{color:var(--muted)} .st-enviado{color:var(--info)} .st-fechado{color:var(--ok)} .st-perdido{color:var(--bad)}
.st-aguardando{color:var(--muted)} .st-produzindo{color:var(--warn)} .st-pronto{color:var(--info)} .st-entregue{color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* produção (quadro) */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.board{grid-template-columns:minmax(0,1fr)}}
.lane{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center}
.lane h3 .num{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.card .it{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.late{color:var(--bad);font-weight:600}
.lane .none{font-size:12.5px;color:var(--muted);text-align:center;padding:12px 0}

/* produtos */
.cat-h{font-family:var(--f-display);font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);margin:6px 0 -6px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.prod:hover{border-color:var(--muted)}
.prod .ph{aspect-ratio:16/9;max-width:100%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.prod .ph img{width:100%;height:100%;object-fit:cover}
.prod .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.prod .nm{font-weight:600}
.prod .pr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prod .pr .num{font-size:15px}

/* gaveta */
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.dr-h h2{font-size:17px;text-transform:uppercase;letter-spacing:.04em}
.dr-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.dr-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface)}
.dr-f .sp{flex:1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec>h4{margin:0;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 80px 74px 100px 30px;gap:8px;align-items:end}
.item .full{grid-column:1/-1}
.item .tot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;color:var(--link);cursor:pointer;font-size:12.5px;text-decoration:underline}
.item .x{border:0;background:transparent;color:var(--bad);font-size:20px;cursor:pointer;padding:6px 0}
@media (max-width:520px){.item{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 30px}.item .pname{grid-column:1/-1}}
.totals{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between}
.totals .num{font-size:14px}
.totals .big{border-top:1px solid var(--line);margin-top:4px;padding-top:8px;font-weight:600}
.totals .big .num{font-size:20px;background:var(--accent);color:var(--accent-ink);padding:0 8px;border-radius:3px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;padding:4px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb a{position:absolute;inset:0}
.thumb button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:11px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1;z-index:2}
.upl{width:96px;height:72px;border:1px dashed var(--muted);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--muted);cursor:pointer;text-align:center}
.upl input{display:none}
.note{font-size:12.5px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.chk input{width:18px;height:18px;margin-top:1px;flex:none}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:6px}
.hist button{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.wa-box{width:100%;min-height:200px;font-family:var(--f-mono);font-size:12px}

/* login */
body:not(.logado) .top,body:not(.logado) main,body:not(.logado) #drawer-root{display:none}
body.logado #login{display:none}
#login{min-height:100vh;display:grid;place-items:center;align-content:center;gap:22px;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:#E9E9E7;
  background-image:linear-gradient(135deg,transparent 0 46%,rgba(255,196,0,.16) 46% 54%,transparent 54%);background-size:44px 44px}
#login .logo-big{width:150px;height:150px;display:block}
.login-card{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:8px;padding:26px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.login-brand h1{font-size:18px;text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.login-brand small{color:var(--muted);font-size:12.5px}
.stamp.big{font-size:34px;padding:4px 12px}
.login-err{margin:0;color:var(--bad);font-size:13px}
.who{font-size:13px;color:var(--top-muted)}
.who b{color:var(--top-ink)}
.lib{background:var(--accent-soft);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.lib p{margin:0;font-size:13px}
@media (max-width:560px){.who{display:none}}
.prow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.pthumb{width:56px;height:42px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center;flex:none}
.pthumb img{width:100%;height:100%;object-fit:cover}
.prow label.f{flex:1;min-width:180px}
main a,.dr-b a,.note a{color:var(--link)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-size:13.5px}
.toast.err{background:var(--bad);color:#fff}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="backend.js"></script>
</head>
<body>

<section id="login" aria-label="Entrar">
  <img class="logo-big" src="tc-logo.png" alt="TC Pré Moldados – Equipamentos e Locações">
  <form class="login-card" id="f-login" autocomplete="on">
    <div class="login-brand"><div><h1>Acesso da equipe</h1><small>Orçamentos, clientes e produção</small></div></div>
    <label class="f"><span>E-mail</span><input id="l-user" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="f"><span>Senha</span><input id="l-pass" name="password" type="password" autocomplete="current-password" required></label>
    <p class="login-err" id="l-err" role="alert" hidden>Login ou senha incorretos.</p>
    <button class="btn primary" type="submit">Entrar</button>
  </form>
</section>
<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand"><img class="logo" src="tc-logo.png" alt="TC"><div><h1>TC Pré Moldados</h1><small>Equipamentos e locações · sistema interno</small></div></div>
      <div class="tools"><span class="who">Olá, <b id="who"></b></span><button class="btn sm ghost" data-act="empresa" type="button">Dados da empresa</button><button class="btn sm ghost" data-act="sair" type="button">Sair</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main id="main"><div class="empty"><b>Carregando dados da equipe…</b>Conectando ao banco compartilhado.</div></main>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script>
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fnum=n=>(Number(n)||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
const pnum=v=>{if(typeof v==="number")return v;v=String(v??"").trim().replace(/\s|R\$/g,"");if(!v)return 0;if(v.includes(","))v=v.replace(/\./g,"").replace(",",".");const n=parseFloat(v);return isNaN(n)?0:n};
const inNum=n=>(n===""||n==null)?"":String(n).replace(".",",");
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const addDays=(iso,n)=>{const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fdate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"—";
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const fmes=k=>{const[y,m]=k.split("-");return MESES[+m-1]+" de "+y};
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();

const rateioDe=k=>{const r=fin().rateio.slice().sort((a,b)=>a.desde.localeCompare(b.desde));let cur=r[0];r.forEach(x=>{if(x.desde<=k)cur=x});return cur};
const VIEWS={painel:"Painel",orcamentos:"Orçamentos",producao:"Produção",clientes:"Clientes",produtos:"Produtos",custos:"Financeiro"};

function calc(o){
  const sub=(o.itens||[]).reduce((s,i)=>s+pnum(i.qtd)*pnum(i.preco),0);
  const dv=pnum(o.desconto?.valor);
  const desc=o.desconto?.tipo==="%"?sub*dv/100:dv;
  const frete=pnum(o.frete);
  return {sub,desc,frete,total:Math.max(0,sub-desc+frete)};
}
function toast(msg,err){const r=$("#toast-root");r.innerHTML=`<div class="toast${err?" err":""}" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",err?6000:2800)}
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return "Sem permissão para salvar. Saia e entre de novo no sistema.";
  if(c==="quota_exceeded")return "O banco de dados está cheio. Exclua registros antigos para continuar.";
  if(c==="resource_exhausted")return "Muitas alterações seguidas. Espere alguns segundos e tente de novo.";
  return "Não foi possível salvar ("+(c||"erro")+"). Tente de novo.";
}

/* ---------- dados ---------- */
let db=null,assets=null,downloads=null,dbState="loading";
const COLS=["produtos","clientes","orcamentos","os","custos"];
const S={produtos:[],clientes:[],orcamentos:[],os:[],custos:[],empresa:{}};
const ui={mes:null,orcFiltro:"abertos",orcBusca:"",cliBusca:"",custoMes:null};

async function boot(){
  if(!(window.tcBackend&&tcBackend.configurado)){dbState="none";render();return}
  db=await tcBackend.use("db");
  assets=await tcBackend.use("assets");
  downloads=await tcBackend.use("downloads");
  let pending=new Set(COLS);
  COLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));
    pending.delete(c);if(!pending.size)dbState="ok";render();
  },e=>{toast("Erro ao carregar "+c+": "+(e.message||e.code),true)}));
  db.doc("config/empresa").onSnapshot(s=>{S.empresa=s.exists?s.data():{}},()=>{});
  db.doc("config/financeiro").onSnapshot(s=>{S.financeiro=s.exists?s.data():{};if(route()==="custos")render()},()=>{});
  db.doc("config/liberacao").onSnapshot(s=>{S.liberacao=s.exists?s.data():{}},()=>{});
}
async function put(col,id,data){
  try{
    if(id){await db.collection(col).doc(id).set(data);return id}
    const r=await db.collection(col).add(data);return r.id;
  }catch(e){toast(errMsg(e),true);throw e}
}
async function del(col,id){try{await db.collection(col).doc(id).delete()}catch(e){toast(errMsg(e),true);throw e}}
const nextNum=(list,start)=>list.reduce((m,x)=>Math.max(m,Number(x.numero)||0),start-1)+1;
const byId=(col,id)=>S[col].find(x=>x.id===id);

const mesDe=o=>(o.fechadoEm||o.data||"").slice(0,7);
function mesesDisponiveis(){
  const s=new Set([today().slice(0,7)]);
  S.orcamentos.forEach(o=>o.status==="fechado"&&mesDe(o)&&s.add(mesDe(o)));
  S.custos.forEach(c=>c.data&&s.add(c.data.slice(0,7)));
  return [...s].sort().reverse();
}
function vPainel(){
  const meses=mesesDisponiveis();
  if(!ui.mes){
    const cur=today().slice(0,7);
    const temCur=S.orcamentos.some(o=>o.status==="fechado"&&mesDe(o)===cur);
    ui.mes=temCur?cur:(meses.find(k=>S.orcamentos.some(o=>o.status==="fechado"&&mesDe(o)===k))||cur);
  }
  const k=ui.mes;
  const fech=S.orcamentos.filter(o=>o.status==="fechado"&&mesDe(o)===k);
  const fat=fech.reduce((s,o)=>s+calc(o).total,0);
  const custos=S.custos.filter(c=>(c.data||"").startsWith(k)&&ehCusto(c));
  const cst=custos.reduce((s,c)=>s+pnum(c.valor),0);
  const res=fat-cst;
  const abertos=S.orcamentos.filter(o=>o.status==="rascunho"||o.status==="enviado");
  const vAb=abertos.reduce((s,o)=>s+calc(o).total,0);
  const decididos=S.orcamentos.filter(o=>(o.data||"").startsWith(k)&&(o.status==="fechado"||o.status==="perdido"));
  const conv=decididos.length?Math.round(100*decididos.filter(o=>o.status==="fechado").length/decididos.length):null;
  // por categoria (desconto distribuído proporcionalmente)
  const porCat={};

  const cats=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const maxC=Math.max(1,...cats.map(x=>x[1]));
  const porCli={};
  fech.forEach(o=>{const n=o.clienteNome||"Sem cliente";porCli[n]=(porCli[n]||0)+calc(o).total});
  const clis=Object.entries(porCli).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxK=Math.max(1,...clis.map(x=>x[1]));
  const osAt=OS_ORDEM.slice(0,3).map(s=>[s,S.os.filter(o=>o.status===s).length]);
  const atrasadas=S.os.filter(o=>o.status!=="entregue"&&o.prazo&&o.prazo<today()).length;
  return `
  <div class="head"><div><h2>Painel</h2><p>Resultado de ${esc(fmes(k))}</p></div>
    <div class="tools"><select id="sel-mes" aria-label="Mês">${meses.map(m=>`<option value="${m}" ${m===k?"selected":""}>${esc(fmes(m))}</option>`).join("")}</select>
    <button class="btn primary" data-act="novo-orc" type="button">+ Novo orçamento</button></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Faturamento fechado</span><span class="v">${brl(fat)}</span><span class="s">${fech.length} pedido${fech.length===1?"":"s"} no mês</span></div>
    <div class="kpi"><span class="l">Custos lançados</span><span class="v">${brl(cst)}</span><span class="s">${custos.length} lançamento${custos.length===1?"":"s"}</span></div>
    <div class="kpi ${cst? (res>=0?"pos":"neg"):""}"><span class="l">Resultado do mês</span><span class="v">${cst?brl(res):"—"}</span><span class="s">${cst?(fat?Math.round(100*res/fat)+"% do faturamento":""):"Lance os custos para ver a margem"}</span></div>
    <div class="kpi"><span class="l">Orçamentos em aberto</span><span class="v">${brl(vAb)}</span><span class="s">${abertos.length} aguardando resposta${conv!==null?` · conversão ${conv}%`:""}</span></div>
  </div>
  <div class="cols2">
    <div class="panel"><h3>Faturamento por produto</h3>${cats.length?`<div class="bars">${cats.map(([n,v])=>`<div class="bar-row"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${(100*v/maxC).toFixed(1)}%"></div></div><span class="v">${brl(v)}</span></div>`).join("")}</div>`:`<div class="note">Nenhum pedido fechado neste mês.</div>`}</div>
    <div class="panel"><h3>Produção agora</h3>
      <div class="bars">${osAt.map(([s,n])=>`<div class="bar-row"><span class="n">${OS_ST[s]}</span><div class="bar-track"><div class="bar-fill" style="width:${S.os.length?(100*n/Math.max(1,...osAt.map(x=>x[1]))):0}%"></div></div><span class="v">${n} OS</span></div>`).join("")}</div>
      <p class="note" style="margin:12px 0 0">${atrasadas?`<span class="late">${atrasadas} OS com prazo vencido.</span> `:""}<a href="#producao">Abrir quadro de produção</a></p>
    </div>
  </div>
  <div class="cols2">
    <div class="panel"><h3>Maiores clientes do mês</h3>${clis.length?`<div class="bars">${clis.map(([n,v])=>`<div class="bar-row"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="bar-track"><div class="bar-fill" style="width:${(100*v/maxK).toFixed(1)}%"></div></div><span class="v">${brl(v)}</span></div>`).join("")}</div>`:`<div class="note">Sem vendas no mês.</div>`}</div>

  </div>`;
}
function orcMiniList(list){
  if(!list.length)return `<div class="note">Nenhum orçamento ainda.</div>`;
  return `<div class="hist">${list.map(o=>`<button type="button" data-act="abrir-orc" data-id="${o.id}"><span><b class="num">#${o.numero}</b> ${esc(o.clienteNome||"Sem cliente")}<br><span class="sub">${fdate(o.data)}</span></span><span style="text-align:right"><span class="num">${brl(calc(o).total)}</span><br><span class="pill st-${o.status}">${ORC_ST[o.status]||o.status}</span></span></button>`).join("")}</div>`;
}

async function shrink(f){
  if(!/^image\/(jpeg|png|webp)$/.test(f.type))return f;
  try{
    const url=URL.createObjectURL(f);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,2000/Math.max(im.naturalWidth,im.naturalHeight));if(k===1&&f.size<2e6){URL.revokeObjectURL(url);return f}
    const c=document.createElement("canvas");c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
    return await new Promise(r=>c.toBlob(b=>r(b||f),"image/jpeg",.85));
  }catch(e){return f}
}
async function uploadFiles(files){
  const out=[];
  for(const f of files){
    try{
      const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
      const b=isPdf?f:await shrink(f);
      const type=isPdf?"application/pdf":(b.type||f.type||"image/jpeg");
      const r=await assets.upload(b,{type});
      out.push({id:r.id,nome:f.name,tipo:r.contentType});
    }catch(e){
      const m=e.code==="too_large"?"maior que 20 MB":e.code==="unsupported_type"?"formato não aceito (use JPG, PNG ou PDF)":e.code==="quota_or_state"?"espaço de arquivos cheio":(e.message||e.code);
      toast("Não foi possível enviar "+f.name+": "+m,true);
    }
  }
  return out;
}

  L.push("",`Subtotal: ${brl(c.sub)}`);
  if(c.desc)L.push(`Desconto: − ${brl(c.desc)}`);

/* ---------- PIX copia e cola (padrão BR Code do Banco Central) ---------- */
function pixChave(k){k=String(k||"").trim();if(!k)return "";if(k.includes("@"))return k.toLowerCase();if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(k))return k.toLowerCase();if(/^[\d\s().\/+-]+$/.test(k)){const d=k.replace(/\D/g,"");return k.startsWith("+")?"+"+d:d}return k}
function pixTxt(t,max){return String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9 ]/g,"").trim().toUpperCase().slice(0,max)}
function pixCrc(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function pixCodigo(valor,txid){
  const E=S.empresa||{};const k=pixChave(E.chavePix);if(!k)return null;
  const f=(id,v)=>id+String(v.length).padStart(2,"0")+v;
  const s="000201"+f("26",f("00","br.gov.bcb.pix")+f("01",k))+"52040000"+"5303986"+(valor>0?f("54",valor.toFixed(2)):"")+"5802BR"
    +f("59",pixTxt(E.pixTitular||E.razaoSocial||E.nome||"TC PRE MOLDADOS",25)||"TC PRE MOLDADOS")+f("60",pixTxt(E.pixCidade||"Joao Camara",15)||"JOAO CAMARA")
    +f("62",f("05",(pixTxt(txid,25).replace(/ /g,""))||"***"))+"6304";
  return s+pixCrc(s);
}
function pixDoOrc(o){const c=calc(o);const ent=ehEntrada(o.pagamento);const valor=ent?parcelas(o).entrada:c.total;const cod=pixCodigo(valor,"ORC"+(o.numero||""));return cod?{valor,ent,cod}:null}

/* ---------- custos ---------- */
function vCustos(){
  const meses=[...new Set([today().slice(0,7),...S.custos.map(c=>(c.data||"").slice(0,7)).filter(Boolean),...S.orcamentos.filter(o=>o.status==="fechado").map(mesDe).filter(Boolean)])].sort().reverse();
  if(!ui.custoMes)ui.custoMes=today().slice(0,7);
  if(!ui.custoTipo)ui.custoTipo="todos";
  const k=ui.custoMes,F=fin();
  const doMes=S.custos.filter(c=>(c.data||"").startsWith(k));
  const soma=f=>doMes.filter(f).reduce((s,c)=>s+pnum(c.valor),0);
  const entradas=S.orcamentos.filter(o=>o.status==="fechado"&&mesDe(o)===k).reduce((s,o)=>s+calc(o).total,0);
  const dir=soma(c=>tipoDe(c)==="Custo direto"),ind=soma(c=>tipoDe(c)==="Custo indireto");
  const lucro=entradas-dir-ind;
  const R=rateioDe(k);
  const linhas=SOCIOS.map(n=>{const pct=pnum(R[n]);const parte=lucro*pct/100;const ret=soma(c=>tipoDe(c)==="Retirada de sócio"&&c.socio===n);const pes=soma(c=>tipoDe(c)==="Despesa pessoal"&&c.socio===n);return{n,pct,parte,ret,pes,saldo:parte-ret-pes}});
  const semSocio=soma(c=>(tipoDe(c)==="Retirada de sócio"||tipoDe(c)==="Despesa pessoal")&&!SOCIOS.includes(c.socio));
  const l=doMes.filter(c=>ui.custoTipo==="todos"||tipoDe(c)===ui.custoTipo).sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const pc={};doMes.filter(ehCusto).forEach(c=>{const kk=c.categoria||"Outros";pc[kk]=(pc[kk]||0)+pnum(c.valor)});
  const cats=Object.entries(pc).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...cats.map(x=>x[1]));
  const pcc={};doMes.filter(ehCusto).forEach(c=>{const kk=c.centro||"Sem centro";pcc[kk]=(pcc[kk]||0)+pnum(c.valor)});
  const cens=Object.entries(pcc).sort((a,b)=>b[1]-a[1]);const mxc=Math.max(1,...cens.map(x=>x[1]));
  const catOpts=t=>F.categorias.filter(c=>c.tipo===t).map(c=>`<option value="${esc(c.nome)}" data-centro="${esc(c.centro||"")}">${esc(c.nome)}</option>`).join("");
  const bars=(arr,m)=>arr.length?`<div class="bars">${arr.map(([n,v])=>`<div class="bar-row"><span class="n" title="${esc(n)}">${esc(n)}</span><div class="bar-track"><div class="bar-fill cost" style="width:${(100*v/m).toFixed(1)}%"></div></div><span class="v">${brl(v)}</span></div>`).join("")}</div>`:`<div class="note">Sem custos lançados.</div>`;
  return `<div class="head"><div><h2>Financeiro</h2><p>Entradas, despesas e rateio de lucros de ${esc(fmes(k))}.</p></div>
   <div class="tools"><select id="sel-custo-mes" aria-label="Mês">${meses.map(m=>`<option value="${m}" ${m===k?"selected":""}>${esc(fmes(m))}</option>`).join("")}</select></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Entradas (vendas fechadas)</span><span class="v">${brl(entradas)}</span><span class="s">Orçamentos fechados no mês</span></div>
    <div class="kpi"><span class="l">Custos diretos</span><span class="v">${brl(dir)}</span><span class="s">Material, produção, frete</span></div>
    <div class="kpi"><span class="l">Custos indiretos</span><span class="v">${brl(ind)}</span><span class="s">Estrutura e administrativo</span></div>
    <div class="kpi ${lucro>=0?"pos":"neg"}"><span class="l">Lucro do mês</span><span class="v">${brl(lucro)}</span><span class="s">${entradas?Math.round(100*lucro/entradas)+"% das entradas":"Sem vendas fechadas"}</span></div>
  </div>
  <div class="panel"><h3>Rateio de lucros · ${SOCIOS.map(n=>`${n} ${fnum(pnum(R[n]))}%`).join(" / ")}</h3>
    <div class="tbl-wrap" style="border:0"><table><thead><tr><th>Sócio</th><th class="r">%</th><th class="r">Parte do lucro</th><th class="r">Retiradas</th><th class="r">Despesas pessoais</th><th class="r">Saldo a receber</th></tr></thead>
    <tbody>${linhas.map(x=>`<tr><td><b>${x.n}</b></td><td class="r num">${fnum(x.pct)}%</td><td class="money">${brl(x.parte)}</td><td class="money">− ${brl(x.ret)}</td><td class="money">− ${brl(x.pes)}</td><td class="money" style="font-weight:600;color:${x.saldo<0?"var(--bad)":"var(--ok)"}">${brl(x.saldo)}</td></tr>`).join("")}</tbody></table></div>
    <p class="note" style="margin:10px 0 0">Lucro = entradas − custos diretos − custos indiretos. Retiradas e despesas pessoais saem da parte de cada sócio. Regra: 60% Thiago e 40% Pedro até novembro de 2026, 50% / 50% a partir de dezembro.${semSocio?` <span class="late">${brl(semSocio)} em retiradas sem sócio informado.</span>`:""}</p>
  </div>
  <form class="panel" id="f-custo"><h3>Lançar despesa</h3><div class="grid g4">
    <label class="f"><span>Data</span><input id="k-data" type="date" value="${today()}"></label>
    <label class="f"><span>Tipo</span><select id="k-tipo">${TIPOS_DESP.map(t=>`<option>${t}</option>`).join("")}</select></label>
    <label class="f"><span>Categoria</span><select id="k-cat">${catOpts("Custo direto")}<option value="__outra">Outra…</option></select></label>
    <label class="f"><span>Centro de custo</span><select id="k-centro">${F.centros.map(c=>`<option>${esc(c)}</option>`).join("")}</select></label>
    <label class="f" id="k-socio-wrap" hidden><span>Sócio</span><select id="k-socio">${SOCIOS.map(n=>`<option>${n}</option>`).join("")}</select></label>
    <label class="f" id="k-outra-wrap" hidden><span>Nova categoria</span><input id="k-outra" placeholder="Nome da categoria"></label>
    <label class="f" style="grid-column:span 2"><span>Descrição / fornecedor</span><input id="k-desc" placeholder="Ex.: 40 barras CA-50 3/8 – Gerdau"></label>
    <label class="f"><span>Valor (R$)</span><input id="k-val" inputmode="decimal" placeholder="0,00"></label>
    <label class="f"><span>Pago com</span><select id="k-forma"><option>PIX</option><option>Dinheiro</option><option>Cartão</option><option>Boleto</option><option>Transferência</option></select></label>
  </div><div style="margin-top:12px"><button class="btn primary" type="submit">Lançar</button></div></form>
  <div class="chips">${[["todos","Todos"],...TIPOS_DESP.map(t=>[t,t])].map(([kk,v])=>`<button type="button" class="chip" data-act="custo-tipo" data-id="${esc(kk)}" aria-pressed="${ui.custoTipo===kk}">${esc(v)}</button>`).join("")}</div>
  <div>${l.length?`<div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Centro</th><th>Descrição</th><th class="r">Valor</th><th></th></tr></thead><tbody>${l.map(c=>`<tr><td class="num">${fdate(c.data)}${c.lancadoPor?`<div class="sub">${esc(c.lancadoPor)}</div>`:""}</td><td>${esc(tipoDe(c))}${c.socio?`<div class="sub">${esc(c.socio)}</div>`:""}</td><td>${esc(c.categoria||"—")}</td><td>${esc(c.centro||"—")}</td><td>${esc(c.descricao||"")}${c.forma?`<div class="sub">${esc(c.forma)}</div>`:""}</td><td class="money">${brl(c.valor)}</td><td class="r"><button type="button" class="btn sm danger" data-act="excluir-custo" data-id="${c.id}">Excluir</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Nenhum lançamento ${ui.custoTipo==="todos"?"":"de "+esc(ui.custoTipo.toLowerCase())+" "}em ${esc(fmes(k))}</b>Lance compras, contas, retiradas e despesas pessoais para fechar o mês.</div>`}</div>
  <div class="cols2">
    <div class="panel"><h3>Custos por categoria</h3>${bars(cats,mx)}</div>
    <div class="panel"><h3>Custos por centro de custo</h3>${bars(cens,mxc)}</div>
  </div>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  if(t.tagName==="A")return;
  switch(a){
    case "novo-orc":novoOrc();break;
    case "abrir-orc":abrirOrc(id);break;
    case "orc-filtro":ui.orcFiltro=id;$$(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.id===id));renderOrcList();break;
    case "add-item":syncEd();ed.itens.push({produtoId:"",descricao:"",categoria:"",unidade:"m",qtd:"",preco:""});renderItens();updTot();break;
    case "tog-desc":syncEd();{const it=ed.itens[+id];it.usarCompleta=!it.usarCompleta;if(it.usarCompleta&&!it.descricaoCompleta)it.descricaoCompleta=it.descricao||"";}renderItens();break;
    case "tog-todas":{syncEd();const on=!ed.itens.every(i=>i.usarCompleta);ed.todasCompletas=on;ed.itens.forEach(i=>{i.usarCompleta=on;if(on&&!i.descricaoCompleta)i.descricaoCompleta=i.descricao||""});renderItens();t.textContent=on?"Resumida em todos":"Descrição completa em todos";break}
    case "rm-item":syncEd();ed.itens.splice(+id,1);renderItens();updTot();break;
    case "rm-foto":{const[box,i]=id.split(":");const obj=box==="o-fotos"?ed:box==="s-fotos"?eos:eprod._proxy;const arr=obj.fotos.slice();arr.splice(+i,1);obj.fotos=arr;renderFotos(box,box+"-note",obj);break}
    case "salvar-orc":if(await salvarOrc())closeDrawer();break;
    case "fechar-orc":await fecharOrc();break;
    case "pix-orc":{if(!(await salvarOrc(true)))return;const px=pixDoOrc(ed);if(!px){toast("Cadastre a chave PIX em Dados da empresa.",true);break}copiar(px.cod,"#o-wa","#o-share");toast(`Código PIX de ${brl(px.valor)} copiado. Cole na conversa do WhatsApp.`);break}
    case "wa-orc":if(!(await salvarOrc(true)))return;copiar(textoWa(ed),"#o-wa","#o-share");break;
    case "pdf-orc":if(!(await salvarOrc(true)))return;await gerarPdf(ed,"orc");break;
    case "termo-orc":if(!(await salvarOrc(true)))return;if(!ed.clienteId||!ed.clienteDoc||!ed.clienteEnd){toast("Para o termo, preencha nome, CPF/CNPJ e endereço de entrega do cliente.",true);return}await gerarTermo(ed);break;
    case "liberar":await liberar();break;
    case "excluir-orc":if(!armed(t))return;try{await del("orcamentos",ed._id);toast("Orçamento excluído.");closeDrawer()}catch(_){}break;
    case "abrir-os":if(e.target.closest("[data-act=avancar-os]"))return;abrirOS(id);break;
    case "avancar-os":e.stopPropagation();await avancarOS(id);break;
    case "salvar-os":await salvarOS();break;
    case "pdf-os":syncOS();await gerarPdf(eos,"os");break;
    case "excluir-os":if(!armed(t))return;try{await del("os",eos._id);toast("OS excluída.");closeDrawer()}catch(_){}break;
    case "novo-cli":abrirCli(null);break;
    case "abrir-cli":abrirCli(id);break;
    case "salvar-cli":await salvarCli();break;
    case "orc-cli":{const cid=ecli._id;closeDrawer();novoOrc(cid);break}
    case "excluir-cli":if(!armed(t))return;try{await del("clientes",ecli._id);toast("Cliente excluído.");closeDrawer()}catch(_){}break;
    case "novo-prod":abrirProd(null);break;
    case "abrir-prod":abrirProd(id);break;
    case "salvar-prod":await salvarProd();break;
    case "excluir-prod":if(!armed(t))return;try{await del("produtos",eprod._id);toast("Produto excluído.");closeDrawer()}catch(_){}break;
    case "custo-tipo":ui.custoTipo=id;render();break;
    case "excluir-custo":if(!armed(t))return;try{await del("custos",id);toast("Custo excluído.")}catch(_){}break;
    case "empresa":if(dbState==="ok")abrirEmpresa();break;
    case "salvar-empresa":{const d={nome:$("#e-nome").value.trim(),responsavel:$("#e-resp").value.trim(),razaoSocial:$("#e-razao").value.trim(),cidadeForo:S.empresa?.cidadeForo||"João Câmara/RN",telefone:$("#e-tel").value.trim(),cnpj:$("#e-cnpj").value.trim(),email:$("#e-email").value.trim(),endereco:$("#e-end").value.trim(),rodape:$("#e-rod").value,chavePix:$("#e-pix").value.trim(),pixTitular:$("#e-pix-tit").value.trim(),pixCidade:$("#e-pix-cid").value.trim()};try{await db.doc("config/empresa").set(d);S.empresa=d;toast("Dados da empresa salvos.");closeDrawer()}catch(err){toast(errMsg(err),true)}break}
    case "sair":closeDrawer();try{await tcBackend.sb.auth.signOut()}catch(_){}location.reload();break;
    case "fechar-drawer":closeDrawer();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="orc-busca"){ui.orcBusca=e.target.value;renderOrcList()}
  if(e.target.id==="cli-busca"){ui.cliBusca=e.target.value;renderCliList()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="sel-mes"){ui.mes=e.target.value;render()}
  if(e.target.id==="sel-custo-mes"){ui.custoMes=e.target.value;render()}

document.addEventListener("submit",async e=>{
  if(e.target.id==="f-login"){e.preventDefault();await entrar();return}
  if(e.target.id!=="f-custo")return;e.preventDefault();
  const tipo=$("#k-tipo").value;const cat=$("#k-cat").value==="__outra"?$("#k-outra").value.trim():$("#k-cat").value;
  const d={data:$("#k-data").value||today(),tipo,categoria:cat||"Outros",centro:$("#k-centro").value,socio:(tipo==="Retirada de sócio"||tipo==="Despesa pessoal")?$("#k-socio").value:"",descricao:$("#k-desc").value.trim(),valor:pnum($("#k-val").value),forma:$("#k-forma").value,criadoEm:new Date().toISOString(),lancadoPor:sessao?.nome||""};
  if(!d.valor){toast("Informe o valor.",true);return}
  try{await put("custos",null,d);ui.custoMes=d.data.slice(0,7);toast("Lançamento salvo: "+tipo.toLowerCase()+".")}catch(_){}
});

/* ---------- acesso ---------- */
// Login pelo Supabase Auth. Os usuários são criados no painel do Supabase (Authentication → Users).
let sessao=null;
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const nomeDe=u=>u.user_metadata?.nome||String(u.email||"").split("@")[0].replace(/[._-]+/g," ").replace(/\b\p{L}/gu,c=>c.toUpperCase());
const sessaoDe=s=>s&&s.user?{login:s.user.email,nome:nomeDe(s.user)}:null;
function aplicaSessao(){document.body.classList.toggle("logado",!!sessao);$("#who").textContent=sessao?sessao.nome:"";if(!sessao){$("#l-pass").value="";setTimeout(()=>$("#l-user").focus(),30)}}
function erroLogin(t){const e=$("#l-err");e.textContent=t;e.hidden=false}
async function entrar(){
  if(!tcBackend.configurado){erroLogin("Sistema ainda não configurado (Supabase).");return}
  const {data,error}=await tcBackend.sb.auth.signInWithPassword({email:$("#l-user").value.trim(),password:$("#l-pass").value});
  if(error){erroLogin(/invalid/i.test(error.message)?"E-mail ou senha incorretos.":"Não foi possível entrar: "+error.message);$("#l-pass").select();return}
  $("#l-err").hidden=true;sessao=sessaoDe(data.session);aplicaSessao();
  if(!db)boot();else render();
}
async function inicia(){
  renderTabs();
  if(!tcBackend.configurado){aplicaSessao();erroLogin("Sistema ainda não configurado (Supabase).");return}
  const {data}=await tcBackend.sb.auth.getSession();
  sessao=sessaoDe(data.session);aplicaSessao();
  tcBackend.sb.auth.onAuthStateChange((ev,s)=>{if(ev==="SIGNED_OUT"&&sessao){sessao=null;aplicaSessao()}});
  if(sessao)boot();
}
inicia();
</script>
