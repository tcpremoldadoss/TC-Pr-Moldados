<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>OS · TC Pré Moldados</title>
<link rel="icon" href="tc-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Página do funcionário da produção: abre pelo link da OS no WhatsApp, sem login. Feita para celular. */
:root{
  --bg:#F1F1F0; --surface:#FFFFFF; --line:#D9D9D7; --ink:#0B0B0B; --muted:#666666;
  --accent:#FFC400; --accent-soft:#FFF4CC; --ok:#1C7A4A; --bad:#B3261E; color-scheme:light;
  --f-display:"Montserrat","Arial Black",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
h1,h2{font-family:var(--f-display);font-weight:800;margin:0}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.top{background:var(--surface);border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;align-items:center;gap:10px}
.top img{width:40px;height:40px}
.top b{font-family:var(--f-display);font-weight:800}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sub{color:var(--muted);font-size:14px}
.status{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--accent-soft)}
.status.ok{background:#E3F3EA;color:var(--ok)}
ul{list-style:none;margin:8px 0 0;padding:0}
li{padding:8px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.obs{white-space:pre-wrap}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.fotos a{display:block;aspect-ratio:1;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--bg);font-size:13px;text-align:center;align-content:center;color:var(--ink)}
.fotos img{width:100%;height:100%;object-fit:cover;display:block}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input,textarea{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);color:var(--ink);font-size:16px}
textarea{min-height:70px;resize:vertical}
.btn{border:0;border-radius:10px;padding:16px;font-weight:700;font-size:17px;background:var(--accent);color:var(--ink);cursor:pointer;width:100%}
.btn:disabled{opacity:.6}
.feito{background:#E3F3EA;border-color:#B7DEC7;text-align:center}
.feito h2{color:var(--ok);margin-bottom:4px}
.erro{color:var(--bad)}
</style>
</head>
<body>
<header class="top"><img src="tc-logo.png" alt=""><b>TC Pré Moldados · Produção</b></header>
<main id="main"><div class="card sub">Carregando a ordem de serviço…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fnum=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:2});
const fdate=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"—";
const fhora=iso=>iso?fdate(iso)+(iso.length>10?" às "+iso.slice(11,16):""):"—";
const cfg=window.TC_CONFIG||{};
const token=new URLSearchParams(location.search).get("t")||"";
const sb=window.supabase&&cfg.supabaseUrl?window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:false}}):null;
const fotoUrl=id=>`${cfg.supabaseUrl}/storage/v1/object/public/arquivos/${encodeURIComponent(id)}`;
let nomeSalvo="";try{nomeSalvo=localStorage.getItem("tc-os-nome")||""}catch(_){}

function mostraErro(msg){$("#main").innerHTML=`<div class="card"><h2>Não foi possível abrir</h2><p class="erro">${esc(msg)}</p><p class="sub">Peça ao escritório para enviar o link da OS de novo.</p></div>`}

function mostra(o){
  const fim=o.status==="pronto"||o.status==="entregue";
  const fotos=(o.fotos||[]).filter(f=>f&&f.id);
  document.title=`OS ${o.numero} · TC Pré Moldados`;
  $("#main").innerHTML=`
  <div class="card">
    <div class="sub">Ordem de serviço</div>
    <h1 class="num">OS ${esc(o.numero)}</h1>
    <div style="margin-top:6px"><b>${esc(o.clienteNome||"—")}</b></div>
    <div class="sub">Prazo: ${fdate(o.prazo)}${o.responsavel?" · Responsável: "+esc(o.responsavel):""}</div>
    <div style="margin-top:8px"><span class="status${fim?" ok":""}">${fim?"Finalizada":"Em produção"}</span></div>
  </div>
  <div class="card"><b>Itens a produzir</b><ul>${(o.itens||[]).map(i=>`<li><b class="num">${fnum(i.qtd)} ${esc(i.unidade||"")}</b> ${esc(i.descricao)}</li>`).join("")||"<li class='sub'>Sem itens</li>"}</ul></div>
  ${o.obsProducao?`<div class="card"><b>Observações</b><div class="obs">${esc(o.obsProducao)}</div></div>`:""}
  ${fotos.length?`<div class="card"><b>Fotos e projeto</b><div class="fotos">${fotos.map(f=>`<a href="${fotoUrl(f.id)}" target="_blank" rel="noopener">${(f.tipo||"").startsWith("image/")?`<img src="${fotoUrl(f.id)}" alt="${esc(f.nome||"foto")}" loading="lazy">`:"Abrir PDF"}</a>`).join("")}</div></div>`:""}
  ${fim?`<div class="card feito"><h2>OS finalizada</h2><div class="sub">${o.finalizadaPor?"Por "+esc(o.finalizadaPor)+" · ":""}${fhora(o.finalizadaEm)}</div><div class="sub">O escritório já foi avisado.</div></div>`:`
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <b>Terminou a produção?</b>
    <label>Seu nome<input id="nome" autocomplete="name" value="${esc(nomeSalvo||o.responsavel||"")}" placeholder="Quem produziu"></label>
    <label>Observação (opcional)<textarea id="obs" placeholder="Ex.: faltou 1 barra, ficou no pátio 2"></textarea></label>
    <button class="btn" id="fin" type="button">✓ Marcar OS ${esc(o.numero)} como finalizada</button>
    <p class="erro" id="err" hidden></p>
  </div>`}`;
  const b=$("#fin");if(b)b.addEventListener("click",finalizar);
}

async function carrega(){
  if(!sb){mostraErro("Sistema não configurado.");return}
  if(token.length<20){mostraErro("Link incompleto. Confira se copiou o link inteiro.");return}
  const {data,error}=await sb.rpc("os_por_link",{p_token:token});
  if(error){mostraErro("Falha de conexão. Verifique a internet e recarregue a página.");return}
  if(!data){mostraErro("Esta OS não foi encontrada. Ela pode ter sido excluída ou o link foi trocado.");return}
  mostra(data);
}

async function finalizar(){
  const b=$("#fin"),nome=$("#nome").value.trim(),obs=$("#obs").value.trim();
  if(!nome){$("#err").textContent="Escreva seu nome.";$("#err").hidden=false;$("#nome").focus();return}
  b.disabled=true;b.textContent="Enviando…";
  try{localStorage.setItem("tc-os-nome",nome)}catch(_){}
  const {data,error}=await sb.rpc("os_finalizar_por_link",{p_token:token,p_nome:nome,p_obs:obs});
  if(error||!data){b.disabled=false;b.textContent="Tentar de novo";$("#err").textContent="Não foi possível enviar. Verifique a internet e tente de novo.";$("#err").hidden=false;return}
  mostra(data);window.scrollTo(0,document.body.scrollHeight);
}
carrega();
</script>
</body>
</html>
